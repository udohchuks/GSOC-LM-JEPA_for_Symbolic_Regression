# LLM-JEPA Symbolic Regression - Base Configuration
# All hyperparameters in one place.
# Override per experiment by creating experiment-specific configs.

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  # AIF evaluation set
  csv_path:    "data/FeynmanEquations.csv"
  data_dir:    "data/Feynman_with_units/"        # raw Feynman files, no extension
  cache_dir:   "cache/"               # preprocessed .pt files

  # Synthetic pretraining corpus
  synthetic_cache: "cache/synthetic_1M"
  n_synthetic:     1000000              # Colab: 10k, Cloud: 1M+
  n_data_points:   2000              # rows per synthetic equation

  # DataLoader
  n_rows:      200                   # rows subsampled per equation per step
  max_n_vars:  9                     # variable padding size
  batch_size:  128
  num_workers: 16                  # Increased for faster bit-unpacking
  chunk_size:  1000
  max_cache_size: 32                    # prevent cache thrashing during shuffle

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  d_model:      128                  # Downsized for speed
  n_heads:      4
  n_isab:       2                    # ISAB blocks in MixEncoder
  n_col_attn:   2                    # column attention layers
  n_enc_layers: 4                    # Increased to match MixEncoder capacity
  n_dec_layers: 5                    
  m_inducing:   32                   # Reduced from 32
  max_n_vars:   9
  dropout:      0.1

  # ── Predictor (JEPA bottleneck) ───────────────────────────────────────────
  # Kept deliberately small to avoid "lazy encoder" problem.
  # bottleneck_dim = d_model * pred_bottleneck_ratio  (rounded to int)
  predictor:
    pred_n_heads:          4         # attention heads in predictor cross-attn
    pred_bottleneck_ratio: 0.5       # bottleneck_dim = d_model * ratio
    pred_dropout:          0.2       # dropout in predictor cross-attention

# ── Loss ──────────────────────────────────────────────────────────────────────
loss:
  lambda_jepa:   1.0                 # JEPA MSE weight
  lambda_sigreg: 0.1                 # SIGReg weight (robust to change)
  lambda_lm:     1.0                 # LM cross-entropy weight
  lambda_units:  1.0                 # unit prediction weight
  alpha_lm:      2.0                 # penalty for invalid RPN tokens
  num_slices:    256                  # CRITICAL for speed (resetting to 128)
  num_points:    17                   # SIGReg Epps-Pulley test points

# ── Training ──────────────────────────────────────────────────────────────────
training:
  lr:            3e-4
  weight_decay:  1e-2
  max_epochs:    1                   # Sequential: exactly one pass of 1M
  warmup_steps:  5000
  use_synthetic: true               # true = pretrain on synthetic data
  gradient_clip: 1.0                 # gradient clipping value
  val_check_interval: 500            # Validate every 500 steps (essential for giant datasets)
  limit_val_batches: 0.05             # Check ~5,000 equations (5%) for speed

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  log_every_n_steps: 10                  # FLUSH EVERY STEP FOR REAL-TIME VISIBILITY
  # Set to "wandb" for Weights & Biases, "tensorboard" for TensorBoard
  logger:  "tensorboard"
  run_name: "llmjepa_sr_base"

# ── Checkpointing ─────────────────────────────────────────────────────────────
checkpoint:
  dirpath: "checkpoints/"
  save_top_k: 5
  monitor: "val/total"
  mode: "min"
  save_last: true
  filename:      "jepa-{epoch:02d}-{val/total:.4f}"

# ── Hardware ──────────────────────────────────────────────────────────────────
hardware:
  accelerator:  "gpu"               # "cpu" for testing
  devices:      1                   # 1 for Colab, 8 for Cloud
  strategy:     "auto"              # "ddp" for multi-GPU
  precision:    "bf16-mixed"          # bf16 for stability on L4/A100