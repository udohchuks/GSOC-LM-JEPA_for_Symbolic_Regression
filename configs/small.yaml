# Small Model Configuration for 20k+ Synthetic Equations
# Target: ~1M parameters, fast training on Colab Free tier
# Predictor kept minimal to reduce overfitting

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  csv_path:    "data/FeynmanEquations.csv"  # Local (synced via repo)
  data_dir:    "/content/drive/MyDrive/SymbolicRegression/Feynman_with_units/"
  cache_dir:   "/content/drive/MyDrive/SymbolicRegression/cache/"
  
  # Synthetic data (Scale up to 250k for generalization!)
  synthetic_cache: "/content/drive/MyDrive/SymbolicRegression/cache/synthetic_small"
  n_synthetic:     250000               # 250k equations (prevents overfitting to just 25k)
  n_data_points:   500                  # Fewer data points per equation
  num_workers:     16                   # Increased workers for generation/fetch
  
  # Variable distribution weights for synthetic data generation
  # Adjusted to match AI Feynman: ~16% at 1-2 vars, ~36% at 3 vars, ~27% at 4 vars
  var_weights:
    1: 0.05   # AI Feynman: ~1%
    2: 0.10   # AI Feynman: ~15%
    3: 0.20   # AI Feynman: ~36%
    4: 0.25   # AI Feynman: ~27%
    5: 0.22   # AI Feynman: ~13%
    6: 0.11   # AI Feynman: ~6%
    7: 0.05   # AI Feynman: ~5%
    8: 0.015  # AI Feynman: ~1%
    9: 0.005  # AI Feynman: ~1%

  # DataLoader
  # GPU REDLINE MODE: Set max_cache_size=-1 and batch_size=2048 for maximum speed
  # LAZY MODE: Keep max_cache_size=128 and batch_size=256 for lower RAM usage
  n_rows:      200                      # Very small for fast training
  max_n_vars:  10                       # 9 input variables + 1 output y column
  batch_size:  2048                     # GPU REDLINE: 2048 (keeps GPU at 100%)
  num_workers: 16                       # Max out CPU throughput (was 4)
  chunk_size:  100                      #
  max_cache_size: -1                    # GPU REDLINE: -1 = load ALL into RAM (12-15GB)
                                        # LAZY MODE: 128 = cache 128 chunks (~2GB RAM)
  
  # AIF cache directory (MUST be in Drive)
  cache_dir:   "/content/drive/MyDrive/SymbolicRegression/cache/"

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  # ~5M+ parameter architecture (Ideal for 250k+ data points)
  # d_model must be divisible by n_heads: 256/8=32
  # bottleneck_dim must be divisible by pred_n_heads: 128/4=32
  d_model:      256                     # Scaled to 256 for optimal expression capacity
  n_heads:      8                       # 8 heads → head_dim=32
  n_isab:       2                       # ISA blocks in MixEncoder
  n_col_attn:   2                       # Column attention layers
  n_enc_layers: 6                       # Encoder transformer layers
  n_dec_layers: 6                       # Decoder transformer layers
  m_inducing:   32                      # Inducing points for set attention
  max_n_vars:   10                      # Max variable padding (9 inputs + 1 output)
  dropout:      0.15                    # Dropout for regularization

  # Predictor (JEPA bottleneck)
  predictor:
    pred_n_heads:          4            # Increased to 4 matching bottleneck of 128 (128/4=32)
    pred_bottleneck_ratio: 0.25         # 256 * 0.25 = 64
    pred_dropout:          0.20         # Dropout for regularization

# ── Loss ──────────────────────────────────────────────────────────────────────
loss:
  lambda_jepa:   1.0
  lambda_sigreg: 0.1                    # Increase SIGReg for small data
  lambda_lm:     1.0
  lambda_units:  1.0
  alpha_lm:      2.0
  num_slices:    256                    # Fewer slices (faster)
  num_points:    9                      # Fewer Epps-Pulley points

# ── Training ──────────────────────────────────────────────────────────────────
training:
  lr:            4e-4                   # Slightly lowered for larger d_model
  weight_decay:  1e-2
  max_epochs:    3                      # Dropped from 20 to 3 since corpus size is 10x larger
  warmup_steps:  2000                   # Longer warmup for bigger batches
  
  # GPU REDLINE MODE settings
  use_synthetic: true
  gradient_clip: 1.0
  val_check_interval: 1.0              # 1.0 = validate ONCE per epoch (reduces overhead)
  limit_val_batches: 0.1                # 10% of validation - faster validation

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  log_every_n_steps: 50                 # Log every 50 steps (was 20) - less overhead
  logger:  "tensorboard"
  run_name: "small_250k"

# ── Checkpointing ─────────────────────────────────────────────────────────────
checkpoint:
  dirpath: "/content/drive/MyDrive/SymbolicRegression/checkpoints/"  # Save to Drive
  save_top_k: 3
  monitor: "val/total"
  mode: "min"
  save_last: true
  save_every_n_epochs: 1            # GPU REDLINE: Save once per epoch (NOT every N steps)
  filename: "small-{epoch:02d}-{val/total:.4f}"

# ── Inference ─────────────────────────────────────────────────────────────────
inference:
  pool_size: 100              # Generate 100 expressions instead of default 50
  max_len: 45
  temperature: 0.6            # High diversity to search tree width

# ── Hardware ──────────────────────────────────────────────────────────────────
hardware:
  accelerator:  "gpu"
  devices:      1
  strategy:     "auto"
  precision:    "bf16-mixed"            # BF16 for faster training on T4/A100 (was 16-mixed)
