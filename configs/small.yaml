# Small Model Configuration for 20k+ Synthetic Equations
# Target: ~1M parameters, fast training on Colab Free tier
# Predictor kept minimal to reduce overfitting

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  csv_path:    "data/FeynmanEquations.csv"
  data_dir:    "data/Feynman_with_units/"
  cache_dir:   "cache/"
  
  # Synthetic data (25k+ equations)
  synthetic_cache: "/content/drive/MyDrive/SymbolicRegression/cache/synthetic_small"
  n_synthetic:     25000                # 25k equations (can go up to 50k)
  n_data_points:   500                  # Fewer data points per equation
  num_workers:     4                    # Generation workers
  
  # Variable distribution weights for synthetic data generation
  # Adjusted to match AI Feynman: ~16% at 1-2 vars, ~36% at 3 vars, ~27% at 4 vars
  var_weights:
    1: 0.05   # AI Feynman: ~1%
    2: 0.10   # AI Feynman: ~15%
    3: 0.20   # AI Feynman: ~36%
    4: 0.25   # AI Feynman: ~27%
    5: 0.22   # AI Feynman: ~13%
    6: 0.11   # AI Feynman: ~6%
    7: 0.05   # AI Feynman: ~5%
    8: 0.015  # AI Feynman: ~1%
    9: 0.005  # AI Feynman: ~1%
  
  # DataLoader
  n_rows:      200                      # Very small for fast training
  max_n_vars:  9                        # Reduced padding (vs 9)
  batch_size:  64                       # Larger batches for stability
  num_workers: 2                        # DataLoader workers
  chunk_size:  100                      # Smaller chunks (more frequent saves, easier debugging)
  max_cache_size: 16                    # Larger cache for more chunks

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  # ~1M parameter architecture
  # d_model must be divisible by n_heads
  # bottleneck_dim = d_model * pred_bottleneck_ratio must be divisible by pred_n_heads
  d_model:      64                      # Changed to 64 (divisible by 4, better capacity)
  n_heads:      4                       # Keep 4 heads (attention diversity)
  n_isab:       2                       # Back to 2 (better set encoding)
  n_col_attn:   1                       # Keep at 1 (saves params)
  n_enc_layers: 3                       # Increased from 2 (better encoding)
  n_dec_layers: 3                       # Increased from 2 (better generation)
  m_inducing:   24                      # Increased for better attention
  max_n_vars:   9                       # Match data config
  dropout:      0.15                    # Slightly higher dropout

  # Predictor (JEPA bottleneck) - KEPT SMALL to prevent overfitting
  # bottleneck_dim = 64 * 0.25 = 16 (divisible by pred_n_heads=2)
  predictor:
    pred_n_heads:          2            # Fewer heads
    pred_bottleneck_ratio: 0.25         # 64 * 0.25 = 16 (must be divisible by pred_n_heads)
    pred_dropout:          0.25         # Higher dropout for regularization

# ── Loss ──────────────────────────────────────────────────────────────────────
loss:
  lambda_jepa:   1.0
  lambda_sigreg: 0.4                    # Increase SIGReg for small data
  lambda_lm:     1.0
  lambda_units:  1.0
  alpha_lm:      2.0
  num_slices:    128                    # Fewer slices (faster)
  num_points:    9                      # Fewer Epps-Pulley points

# ── Training ──────────────────────────────────────────────────────────────────
training:
  lr:            5e-4                   # Higher LR for small model
  weight_decay:  1e-2
  max_epochs:    15                     # More epochs for small data
  warmup_steps:  500                    # Shorter warmup
  use_synthetic: true
  gradient_clip: 1.0
  val_check_interval: 100               # Validate every 100 steps
  limit_val_batches: 0.3                # 30% of validation

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  log_every_n_steps: 20
  logger:  "tensorboard"
  run_name: "small_20k"

# ── Checkpointing ─────────────────────────────────────────────────────────────
checkpoint:
  dirpath: "checkpoints_small/"
  save_top_k: 3
  monitor: "val/total"
  mode: "min"
  save_last: true
  save_every_n_steps: 200
  filename: "small-{step:06d}-{val/total:.4f}"

# ── Inference ─────────────────────────────────────────────────────────────────
inference:
  beam_size: 5
  max_len: 64
  temperature: 0.7

# ── Hardware ──────────────────────────────────────────────────────────────────
hardware:
  accelerator:  "gpu"
  devices:      1
  strategy:     "auto"
  precision:    "16-mixed"              # Mixed precision for speed
