# Small Model Configuration for 20k+ Synthetic Equations
# Target: ~1M parameters, fast training on Colab Free tier
# Predictor kept minimal to reduce overfitting

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  csv_path:    "data/FeynmanEquations.csv"
  data_dir:    "data/Feynman_with_units/"
  cache_dir:   "cache/"
  
  # Synthetic data (25k+ equations)
  synthetic_cache: "/content/drive/MyDrive/SymbolicRegression/cache/synthetic_small"
  n_synthetic:     25000                # 25k equations (can go up to 50k)
  n_data_points:   500                  # Fewer data points per equation
  num_workers:     4                    # Generation workers
  
  # Variable distribution weights for synthetic data generation
  # Adjusted to match AI Feynman: ~16% at 1-2 vars, ~36% at 3 vars, ~27% at 4 vars
  var_weights:
    1: 0.05   # AI Feynman: ~1%
    2: 0.10   # AI Feynman: ~15%
    3: 0.20   # AI Feynman: ~36%
    4: 0.25   # AI Feynman: ~27%
    5: 0.22   # AI Feynman: ~13%
    6: 0.11   # AI Feynman: ~6%
    7: 0.05   # AI Feynman: ~5%
    8: 0.015  # AI Feynman: ~1%
    9: 0.005  # AI Feynman: ~1%
  
  # DataLoader
  n_rows:      200                      # Very small for fast training
  max_n_vars:  9                        # Reduced padding (vs 9)
  batch_size:  128                      # Larger batches for better GPU utilization (was 64)
  num_workers: 4                        # More workers for faster data loading (was 2)
  chunk_size:  100                      # Smaller chunks (more frequent saves, easier debugging)
  max_cache_size: 16                    # Larger cache for more chunks

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  # ~1M parameter architecture (991K params = 29% of base)
  # d_model must be divisible by n_heads: 80/4=20
  # bottleneck_dim must be divisible by pred_n_heads: 30/2=15
  d_model:      80                      # Optimized for ~1M total params
  n_heads:      4                       # 4 heads → head_dim=20
  n_isab:       2                       # ISA blocks in MixEncoder
  n_col_attn:   2                       # Column attention layers
  n_enc_layers: 3                       # Encoder transformer layers
  n_dec_layers: 4                       # Decoder transformer layers
  m_inducing:   32                      # Inducing points for set attention
  max_n_vars:   9                       # Max variable padding
  dropout:      0.15                    # Dropout for regularization

  # Predictor (JEPA bottleneck)
  # bottleneck_dim = 80 * 0.375 = 30 (divisible by pred_n_heads=2 → 15)
  predictor:
    pred_n_heads:          2            # Attention heads in predictor
    pred_bottleneck_ratio: 0.375        # 80 * 0.375 = 30
    pred_dropout:          0.25         # Dropout for regularization

# ── Loss ──────────────────────────────────────────────────────────────────────
loss:
  lambda_jepa:   1.0
  lambda_sigreg: 0.4                    # Increase SIGReg for small data
  lambda_lm:     1.0
  lambda_units:  1.0
  alpha_lm:      2.0
  num_slices:    128                    # Fewer slices (faster)
  num_points:    9                      # Fewer Epps-Pulley points

# ── Training ──────────────────────────────────────────────────────────────────
training:
  lr:            5e-4                   # Higher LR for small model
  weight_decay:  1e-2
  max_epochs:    20                     # Increased from 15 for better convergence
  warmup_steps:  500                    # Shorter warmup
  use_synthetic: true
  gradient_clip: 1.0
  val_check_interval: 50                # Validate every 50 steps (must be < num_train_batches)
  limit_val_batches: 0.2                # 20% of validation - faster validation

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  log_every_n_steps: 50                 # Log every 50 steps (was 20) - less overhead
  logger:  "tensorboard"
  run_name: "small_25k"

# ── Checkpointing ─────────────────────────────────────────────────────────────
checkpoint:
  dirpath: "checkpoints_small/"
  save_top_k: 3
  monitor: "val/total"
  mode: "min"
  save_last: true
  save_every_n_steps: 500               # Save every 500 steps (was 200) - less I/O
  filename: "small-{step:06d}-{val/total:.4f}"

# ── Inference ─────────────────────────────────────────────────────────────────
inference:
  beam_size: 5
  max_len: 64
  temperature: 0.7

# ── Hardware ──────────────────────────────────────────────────────────────────
hardware:
  accelerator:  "gpu"
  devices:      1
  strategy:     "auto"
  precision:    "bf16-mixed"            # BF16 for faster training on T4/A100 (was 16-mixed)
